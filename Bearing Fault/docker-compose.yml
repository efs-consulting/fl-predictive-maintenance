# BearingFL — Docker Compose
#
# Services
# --------
#   api   — FastAPI backend (training, inference, WebSocket, chat proxy)
#   nginx — Reverse proxy + static SPA file server
#
# Chat backend
# ------------
# Chat requests are forwarded to the OpenAI-compatible LM Studio endpoint at
# llm.taktik.net.  Set LM_STUDIO_BASE_URL and LM_STUDIO_API_KEY in .env.
# If the primary is unreachable the Anthropic API is used as fallback.
#
# Quick start
# -----------
#   docker compose up --build
#   open http://localhost
#
# Data
# ----
# Pre-processed dataset files (X.npy, y.npy, meta.csv) must be present in
# ./data/ before starting.  To generate them from scratch:
#   docker compose run --rm api python get_data.py

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bearingfl_api
    env_file: .env
    environment:
      DATA_DIR: /app/data
      MODELS_DIR: /app/models
      # LM Studio / llm.taktik.net — read from .env via env_file above
      # LM_STUDIO_BASE_URL, LM_STUDIO_API_KEY, LM_STUDIO_MODEL
    volumes:
      - ./data:/app/data:ro
      - models_data:/app/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - bearingfl

  # ── Nginx (reverse proxy + static file server) ───────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: bearingfl_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bearingfl

# ── Named volumes ───────────────────────────────────────────────────────────────
volumes:
  models_data:
    driver: local

# ── Internal network ───────────────────────────────────────────────────────────
networks:
  bearingfl:
    driver: bridge
