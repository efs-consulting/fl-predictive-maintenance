worker_processes  auto;
error_log         /var/log/nginx/error.log warn;
pid               /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    # Allow large signal / .npy file uploads
    client_max_body_size 50M;

    # Gzip for text assets
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain
                      text/css
                      text/xml
                      text/javascript
                      application/json
                      application/javascript
                      application/xml
                      font/truetype
                      image/svg+xml;

    # ── Upstream: FastAPI backend ──────────────────────────────────────────────
    upstream api {
        server api:8001;
        keepalive 32;
    }

    server {
        listen      80;
        server_name _;

        # ── Static assets (/static/js/*, /static/css/*) ───────────────────────
        # ./static/ is mounted at /usr/share/nginx/html so:
        #   URL  /static/js/app.js  →  /usr/share/nginx/html/js/app.js
        location /static/ {
            alias   /usr/share/nginx/html/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff";
        }

        # ── REST API ──────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── WebSocket ─────────────────────────────────────────────────────────
        location /ws {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 86400s;   # keep alive for long training runs
        }

        # ── SPA root (serve index.html for all other paths) ───────────────────
        location / {
            root      /usr/share/nginx/html;
            try_files /index.html =404;
        }
    }
}
